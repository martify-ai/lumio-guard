<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumio Guard settings</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
    .card { margin-top: 16px; }
    label strong { display: block; color: var(--text-strong); }
    label span { color: var(--text-mid); font-size: 14px; }
    .times { display: flex; gap: 12px; flex-wrap: wrap; }
    .times label { display: grid; gap: 4px; font-size: 14px; color: var(--text-mid); }
    .times input { width: 96px; min-height: 48px; padding: 0 12px; font: inherit; font-weight: 700; color: var(--text-strong); background: var(--surface); border: 1px solid var(--border); border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <p class="brand">Lumio Guard</p>
    <h1>Settings</h1>
    <p>Choose what Lumio Guard blocks in this browser. Changes take effect straight away.</p>

    <section class="card">
      <h2 style="margin-top:0">What to block</h2>
      <div id="categories"></div>
    </section>

    <section class="card">
      <h2 style="margin-top:0">Safe Search</h2>
      <label class="toggle">
        <input type="checkbox" id="safesearch">
        <span>
          <strong>Keep search results safe</strong>
          <span>
            Turns on the strict safe setting on Google, Bing and DuckDuckGo, and Restricted Mode
            on YouTube, and stops them being switched off in this browser. Other search engines
            are not covered yet. Safe modes are run by those companies and can miss things.
          </span>
        </span>
      </label>
    </section>

    <section class="card">
      <h2 style="margin-top:0">Break reminders</h2>
      <label class="toggle">
        <input type="checkbox" id="wellbeing">
        <span>
          <strong>Remind me to take a break</strong>
          <span>
            Lumio Guard counts how long this browser has been in use and shows a gentle
            reminder. It never stops you browsing. It counts time only, never which sites
            you visit. This is browser time, not total screen time.
          </span>
        </span>
      </label>
      <p style="margin:8px 0 4px"><strong>Remind after (minutes)</strong></p>
      <div class="times">
        <label>First <input type="number" id="t0" min="1" max="600" inputmode="numeric"></label>
        <label>Second <input type="number" id="t1" min="1" max="600" inputmode="numeric"></label>
        <label>Third <input type="number" id="t2" min="1" max="600" inputmode="numeric"></label>
      </div>
      <p id="times-note" class="muted" role="status"></p>
    </section>

    <section class="card">
      <h2 style="margin-top:0">Block message</h2>
      <label class="toggle">
        <input type="checkbox" id="friendly">
        <span>
          <strong>Show Lumio Guard's friendly message on blocked pages</strong>
          <span>
            Without this, Chrome shows its own short "blocked" page. To show our message
            instead, Chrome needs to give Lumio Guard access to all websites, and will ask you
            to allow "read and change all your data on all websites". Lumio Guard uses this
            only to swap a blocked page for its message. It does not read, save or send
            anything about the sites you visit.
          </span>
        </span>
      </label>
      <p id="friendly-note" class="muted" hidden></p>
    </section>

    <section class="card">
      <h2 style="margin-top:0">Status</h2>
      <p id="status">Checking…</p>
    </section>

    <p class="muted" style="margin-top:16px">Everything stays on this computer. Lumio Guard sends nothing anywhere.</p>
  </main>
  <script src="options.js" type="module"></script>
</body>
</html>
